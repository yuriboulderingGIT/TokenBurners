name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    # shortcut: Playwright 1.52 can't install Chromium on ubuntu-latest (26.04); unpin after upgrading playwright
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --platform linux/amd64 -t watchtower .
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Check the public contract against the built image and mock portal
        run: bash tests/container_contract.sh watchtower
