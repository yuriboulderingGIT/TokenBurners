name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --platform linux/amd64 -t watchtower .
      - name: Container answers on port 8080
        run: |
          docker run -d -p 8080:8080 --name wt watchtower
          for i in $(seq 1 30); do curl -sf http://localhost:8080/portals && exit 0; sleep 1; done
          docker logs wt; exit 1
