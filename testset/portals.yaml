  - name: boamp-fr
    url: "https://boamp-datadila.opendatasoft.com/api/explore/v2.1/catalog/datasets/boamp/records?select=idweb%2Cobjet%2Cnomacheteur%2Cdateparution%2Cdatelimitereponse%2Cnature_libelle%2Ctype_marche%2Curl_avis&order_by=dateparution%20desc&limit=3"
    country: FR
    software: BOAMP on Opendatasoft
    kind: spa_json
    block: none
    verification: direct
    fixture: fixtures/boamp-fr/list.json
    evidence: https://boamp-datadila.opendatasoft.com/pages/donnees-ouvertes-et-api/
    notes: >
      The documented anonymous GET API returns records under results, including
      null and timezone-aware closing timestamps. The URL projects eight
      non-contact fields and limits the response to three records. Public
      notice links point to a different origin from the API.

