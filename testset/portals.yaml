    verification: direct
    fixture: fixtures/vergabemarktplatz-nrw-de/list.html
    notes: >
      The latest notices appear in a table with publication and closing dates,
      publisher, and a separate forwarding link carrying the notice ID. The
      live page declares ISO-8859-1. The trimmed fixture is UTF-8.

  - name: dtvp-de
    url: https://dtvp.de/ausschreibungen/
    country: DE
    software: DTVP public directory
    kind: ssr
    block: none
    verification: direct
    fixture: fixtures/dtvp-de/list.html
    notes: >
      The public directory offers server-rendered notice cards with title,
      buyer, location and closing date. The public detail page for
      CXP4DKT4YEE also returned 200. This entry covers the directory's card
      markup.

  - name: boamp-fr
    url: "https://boamp-datadila.opendatasoft.com/api/explore/v2.1/catalog/datasets/boamp/records?select=idweb%2Cobjet%2Cnomacheteur%2Cdateparution%2Cdatelimitereponse%2Cnature_libelle%2Ctype_marche%2Curl_avis&where=datelimitereponse%20%3E%3D%20now%28%29%20AND%20nature_libelle%20%3D%20%27Avis%20de%20march%C3%A9%27%20AND%20code_departement%20%3D%20%2775%27&order_by=idweb&limit=100&offset=0"
    country: FR
    software: BOAMP on Opendatasoft
    kind: spa_json
    block: none
    verification: direct
    fixture: fixtures/boamp-fr/list.json
    evidence: https://boamp-datadila.opendatasoft.com/pages/donnees-ouvertes-et-api/
    notes: >
      Bounded monitoring scope (21 Nov): open contract notices for Paris (75),
      i.e. deadline in the future, sorted by the stable idweb with an explicit
      offset so the reader can page. 630 records on 7 pages of 100; the reader
      read all 630 with distinct IDs without a model call. All of France
      (6,505 open) would also fit the 100-page limit. The old URL (limit=3, no
      offset, whole dataset of about 1.73M rows) could not be read completely;
      the saved fixture still documents that case. BOAMP is a notice
      aggregator: its records carry no document links, the files sit on each
      buyer's own platform, so expect "failed: no documents" with the tenders
      delivered.

