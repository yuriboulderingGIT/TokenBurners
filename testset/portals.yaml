# Public test portals (owner: A2). Checked 2026-11-20.
# verification: direct (fetched notice data), shell (fetched a client-rendered entry point),
# or documented (verified the portal from primary sources and direct notice data is pending).
# block applies to the public URL here. A null value means login/captcha could not be assessed.
# Fixture paths are relative to this file. HTML fixtures are trimmed to the notice elements.
portals:
  - name: etenders-ie
    url: "https://www.etenders.gov.ie/epps/quickSearchAction.do?searchType=cftFTS&latest=true"
    country: IE
    software: European Dynamics ePPS
    kind: ssr
    block: none
    verification: direct
    fixture: fixtures/etenders-ie/list.html
    notes: >
      Latest calls for tender appear in table T01 with resource ID, buyer,
      publication and closing timestamps, and relative detail links. The public
      detail page for resource 9539391 also returned 200. Pagination and document
      downloads are outside this check.

  - name: sell2wales-gb
    url: https://www.sell2wales.gov.wales/Search/Search_MainPage.aspx
    country: GB
    software: Sell2Wales
    kind: ssr
    block: none
    verification: direct
    fixture: fixtures/sell2wales-gb/list.html
    document_block: login
    document_block_fixture: fixtures/sell2wales-gb/attachment-policy.txt
    evidence: https://www.sell2wales.gov.wales/sitehelp/help_faq.aspx
    notes: >
      Public result cards contain the reference, OCID, title, buyer and dates.
      The list uses labelled fields and UK date formats. The portal documents a
      registration requirement for attachments.

