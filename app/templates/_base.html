<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Watchtower{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* "Quiet": Patterno's lavender-white and violet, with the noise taken out.
       Colour means state, and only state. Everything else is ink on white. */
    :root {
      --page: #f7f6fc; --surface: #ffffff; --wash: #f4f2fb;
      --ink: #1d1b2e; --ink-2: #4a4860; --muted: #7a778f;
      --line: #ebe9f4; --line-2: #dcd9ea;
      --accent: #6d4fe0; --accent-hover: #5b3fd0;
      --serving: #15a05b; --integrating: #4f7fe8; --healing: #df9208; --failed: #dc4646; --off: #b3b0c4;
      --radius: 12px;
    }
    * { box-sizing: border-box; }
    html { background: var(--page); }
    body { margin: 0; min-height: 100vh; color: var(--ink); background: var(--page);
           font: 14px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    a:hover { color: var(--accent); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
    .muted { color: var(--ink-2); } .faint { color: var(--muted); }
    .nowrap { white-space: nowrap; }

    /* State colour lives on one variable per row or cell */
    .serving { --c: var(--serving); } .integrating { --c: var(--integrating); }
    .healing { --c: var(--healing); } .failed { --c: var(--failed); } .off { --c: var(--off); }
    .dot { display: inline-block; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--off)); }

    /* Top bar: white, flat, one hairline */
    .bar { position: sticky; top: 0; z-index: 5; background: #ffffffeb; border-bottom: 1px solid var(--line);
           backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px); }
    .bar-in { max-width: 1320px; margin: 0 auto; padding: 10px 24px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
    .brand { font: 500 24px/1 "EB Garamond", Georgia, serif; letter-spacing: -.01em; color: var(--ink); margin-right: auto; }
    .brand:hover { color: var(--ink); }
    .add { display: flex; gap: 8px; flex: 1 1 360px; max-width: 540px; }
    .add input { flex: 1; min-width: 0; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line-2);
                 font: inherit; font-size: 13.5px; color: var(--ink); background: var(--surface); }
    .add input::placeholder { color: var(--muted); }
    .add input:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
    .live { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
    .live .dot { --c: var(--serving); }

    .btn { display: inline-flex; align-items: center; padding: 8px 16px; border-radius: 10px; border: 0; cursor: pointer;
           font: 500 13.5px/1.2 inherit; font-family: inherit; color: #fff; background: var(--accent); }
    .btn:hover { color: #fff; background: var(--accent-hover); }
    .btn.ghost { color: var(--ink); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-2); }
    .btn.ghost:hover { background: var(--wash); }
    .btn.danger { color: var(--failed); }
    .btn[disabled] { opacity: .6; cursor: progress; }

    main { max-width: 1320px; margin: 0 auto; padding: 0 24px 48px; }
    .flash { margin-top: 16px; padding: 10px 14px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); }
    .flash.err { color: var(--failed); border-color: color-mix(in srgb, var(--failed) 30%, transparent); }

    /* Headline: the one thing to remember, set in the wordmark's serif */
    .page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap; margin: 36px 0 20px; }
    .headline { font: 500 40px/1.1 "EB Garamond", Georgia, serif; letter-spacing: -.015em; margin: 0; }
    h1 { font-size: 26px; font-weight: 600; letter-spacing: -.02em; margin: 0; }

    /* Summary: one surface split by hairlines, not six cards */
    .summary { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); margin: 0; background: var(--surface);
               border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
    .summary .cell { display: flex; flex-direction: column; gap: 2px; padding: 14px 18px 15px; border-left: 1px solid var(--line); margin: 0; }
    .summary .cell:first-child { border-left: 0; }
    .summary .k, .summary dt { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-2); }
    .summary b { font-size: 28px; font-weight: 500; letter-spacing: -.02em; line-height: 1.2; }
    .summary dd { margin: 0; display: flex; flex-direction: column; gap: 2px; }
    .summary .s { font-size: 12px; color: var(--muted); }
    .summary .zero b { color: var(--muted); }
    .summary .on { background: color-mix(in srgb, var(--c) 7%, var(--surface)); }

    /* Panels */
    .grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; margin-top: 16px; align-items: start; }
    .stack { display: grid; gap: 16px; margin-top: 16px; }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
    .panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 14px 18px; }
    .panel-head h2 { font-size: 15px; font-weight: 600; margin: 0; }
    .panel-head .faint { font-size: 12.5px; }
    .scroll { overflow-x: auto; }

    table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    th { text-align: left; font-size: 12px; font-weight: 500; color: var(--muted); padding: 8px 12px; white-space: nowrap;
         border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--wash); }
    td { padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: #faf9fe; }
    th:first-child, td:first-child { padding-left: 18px; } th:last-child, td:last-child { padding-right: 18px; }
    .num { text-align: right; }

    /* State pill: the dot carries the colour, the word stays in ink */
    .pill { display: inline-flex; align-items: center; gap: 7px; padding: 3px 10px 3px 8px; border-radius: 999px; font-size: 12.5px;
            font-weight: 500; color: var(--ink); background: color-mix(in srgb, var(--c) 11%, var(--surface)); white-space: nowrap; }
    .off .pill { color: var(--ink-2); }
    .host { font-weight: 600; }
    .path { max-width: 240px; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .reason { max-width: 250px; font-size: 12.5px; color: var(--ink-2); margin-top: 1px; }
    td .sub { font-size: 12.5px; color: var(--muted); }

    /* Heartbeat: healthy reads stay faint, so a failure or repair is what you see */
    .beats { display: flex; align-items: flex-end; gap: 2px; height: 18px; }
    .beat { display: inline-block; width: 4px; height: 12px; border-radius: 2px; background: color-mix(in srgb, var(--serving) 38%, var(--surface)); }
    .beat.failed { background: var(--failed); }
    .beat.repair { height: 18px; background: var(--healing); }
    .beat.repair.failed { background: transparent; box-shadow: inset 0 0 0 1.5px var(--failed); }
    .beat.running { background: var(--integrating); animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .3; } }
    @media (prefers-reduced-motion: reduce) { .beat.running { animation: none; } }
    .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--muted); padding: 10px 18px; border-top: 1px solid var(--line); }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend .beat { height: 10px; } .legend .beat.repair { height: 14px; }

    /* Activity: routine reads are one quiet line, everything else gets its reason */
    .feed { list-style: none; margin: 0; padding: 0; max-height: 720px; overflow-y: auto; border-top: 1px solid var(--line); }
    .feed li { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto; gap: 2px 10px; align-items: baseline;
               padding: 10px 18px; border-bottom: 1px solid var(--line); }
    .feed li:last-child { border-bottom: 0; }
    .feed .dot { align-self: center; }
    .feed .what { font-weight: 500; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .feed .where { margin-left: 4px; font-weight: 400; color: var(--ink-2); }
    .feed a.where:hover { color: var(--accent); }
    .feed .when { font-size: 12px; color: var(--muted); white-space: nowrap; }
    .feed details { grid-column: 2 / -1; font-size: 13px; color: var(--ink-2); }
    .feed li.routine { padding-top: 6px; padding-bottom: 6px; font-size: 13px; }
    .feed li.routine .dot { background: color-mix(in srgb, var(--serving) 40%, var(--surface)); width: 6px; height: 6px; }
    .feed li.routine .what { font-weight: 400; color: var(--muted); }
    .feed li.routine .where { color: var(--muted); }
    details summary { cursor: pointer; }
    details summary::marker { color: var(--muted); }
    pre { margin: 8px 0 0; padding: 10px 12px; border-radius: 8px; background: var(--wash); white-space: pre-wrap;
          font: 12px/1.55 ui-monospace, "Cascadia Mono", Consolas, monospace; color: var(--ink-2); }
    .empty { padding: 28px 18px; color: var(--ink-2); }
    code { font-size: 12.5px; padding: 2px 6px; border-radius: 6px; background: var(--wash); }
    footer { margin-top: 24px; font-size: 12px; color: var(--muted); text-align: center; }
    footer a { text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 3px; }

    /* Portal page */
    .crumb { display: inline-block; margin-top: 24px; font-size: 13px; color: var(--ink-2); }
    .crumb + .page-head { margin-top: 10px; margin-bottom: 4px; }
    .page-title { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .portal-url { margin: 0; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
    .portal-url a { text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 3px; }
    .portal-reason { margin: 6px 0 18px; color: var(--ink-2); }
    .summary.facts { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    .summary.facts .s { line-height: 1.4; }
    .summary .none { font-size: 20px; color: var(--muted); }
    .t-title { font-weight: 500; }
    .t-title a:hover { color: var(--accent); }
    .t-meta { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
    .docs { list-style: none; margin: 6px 0 0; padding: 0; font-size: 12.5px; }
    .docs li { display: flex; justify-content: space-between; gap: 10px; padding: 2px 0; }
    .docs a { color: var(--accent); }

    @media (max-width: 1100px) {
      .summary, .summary.facts { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .summary .cell:nth-child(3n + 1) { border-left: 0; }
      .summary .cell:nth-child(n + 4) { border-top: 1px solid var(--line); }
    }
    @media (max-width: 1240px) { .grid { grid-template-columns: 1fr; } }
    @media (max-width: 700px) {
      .bar-in { padding: 10px 16px; gap: 10px; } .live { display: none; }
      main { padding: 0 16px 32px; }
      .headline { font-size: 30px; } .page-head { margin: 24px 0 14px; }
      .summary, .summary.facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .summary .cell { border-left: 1px solid var(--line); border-top: 0; }
      .summary .cell:nth-child(odd) { border-left: 0; }
      .summary .cell:nth-child(n + 3) { border-top: 1px solid var(--line); }
      .summary b { font-size: 24px; }
      .hide-sm { display: none; }
      td, th { padding: 10px; } th:first-child, td:first-child { padding-left: 14px; }
      .path, .reason { max-width: 52vw; }
    }
  </style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <a class="brand" href="/">Watchtower</a>
    <form class="add" id="add-portal">
      <input name="url" type="url" required placeholder="Portal address, e.g. https://…/tenders" aria-label="Portal address">
      <button class="btn" type="submit">Add portal</button>
    </form>
    <span class="live"><i class="dot"></i>Live, updated {{ now }} UTC</span>
  </div>
</header>
<main>
  <div id="flash" role="status"></div>
{% block content %}{% endblock %}
  <footer>Watchtower API: <code>/portals</code> · <a href="/docs">interactive API reference</a></footer>
</main>
<script>
  // Refresh every 10 s, but not while someone reads an opened run or types an address.
  setInterval(() => {
    const typing = document.activeElement && document.activeElement.tagName === "INPUT";
    if (!document.querySelector("details[open]") && !typing) location.reload();
  }, 10000);

  function flash(text, error) {
    const el = document.getElementById("flash");
    el.className = "flash" + (error ? " err" : "");
    el.textContent = text;
  }

  // Buttons and the form call the same API the judges use.
  async function call(method, path, body) {
    const res = await fetch(path, {
      method, headers: body ? {"content-type": "application/json"} : {}, body: body ? JSON.stringify(body) : undefined,
    });
    const data = res.status === 204 ? null : await res.json().catch(() => null);
    if (!res.ok) throw new Error((data && data.detail) || `HTTP ${res.status}`);
    return data;
  }

  document.getElementById("add-portal").addEventListener("submit", async (e) => {
    e.preventDefault();
    const button = e.target.querySelector("button");
    button.disabled = true;
    try {
      const { id } = await call("POST", "/portals", { url: e.target.url.value.trim() });
      location.href = `/ui/portals/${id}`;
    } catch (err) {
      flash(`Could not add the portal: ${err.message}`, true);
      button.disabled = false;
    }
  });
{% block script %}{% endblock %}
</script>
</body>
</html>
