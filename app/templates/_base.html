<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Watchtower{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* Visual language of patterno.de (light): lavender-white page, frosted grey bar, Inter,
       white cards with soft shadows, pill shapes. Layout is an operator dashboard. */
    :root {
      --bg: #f5f4fc; --wash: #ece9fb; --card: #ffffffa6; --solid: #ffffff; --edge: #ffffffcc; --text: #18181b; --muted: #52525b; --faint: #8a8a93;
      --border: #0000000f; --row: #f9f8fe; --shadow: 0 1px 2px #1819390a, 0 8px 24px #1919390f;
      --nav: #8f8f97d9; --grad-a: #c4b5fd; --grad-b: #8b5cf6; --accent: #6366f1; --code: #f4f3fb;
      --serving: #10b981; --integrating: #3b82f6; --healing: #f59e0b; --failed: #ef4444;
    }
    /* Optional dark version: <html data-theme="dark"> */
    :root[data-theme="dark"] {
      --bg: #0a0a1a; --wash: #1b1b40; --card: #12122e; --text: #ffffff; --muted: #ffffffb3; --faint: #ffffff73;
      --border: #ffffff14; --row: #ffffff0d; --shadow: 0 8px 24px #00000066; --nav: #2a2a4dcc; --code: #1a1a3e;
      --card: #16163a99; --solid: #16163a; --edge: #ffffff1f;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: var(--text); background: var(--bg);
           font: 14px/1.5 Inter, system-ui, -apple-system, sans-serif; font-variant-numeric: tabular-nums;
           -webkit-font-smoothing: antialiased; }
    /* Colour fields pinned to the viewport edges: the margins get colour, the glass panels something to blur. */
    body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; background:
      radial-gradient(30vw 60vh at -6% 30%, #a78bfa8c, transparent 72%),
      radial-gradient(28vw 55vh at 106% 22%, #818cf880, transparent 72%),
      radial-gradient(34vw 45vh at 4% 108%, #e879f959, transparent 72%),
      radial-gradient(30vw 50vh at 100% 100%, #60a5fa66, transparent 72%),
      radial-gradient(50vw 30vh at 55% -8%, var(--wash), transparent 70%); }
    .glass { background: var(--card); border: 1px solid var(--edge); box-shadow: var(--shadow);
             backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4); }
    main { max-width: 1680px; margin: 0 auto; padding: 12px 20px 40px; }
    a { color: inherit; text-decoration-color: var(--faint); text-underline-offset: 3px; }
    a:hover { color: var(--grad-b); }
    a:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
    .muted { color: var(--muted); } .faint { color: var(--faint); }
    .serving { --c: var(--serving); } .integrating { --c: var(--integrating); }
    .healing { --c: var(--healing); } .failed { --c: var(--failed); }
    .off { --c: var(--faint); }
    .dot { display: inline-block; flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }

    /* Top bar */
    header { position: sticky; top: 12px; z-index: 5; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
             padding: 6px 6px 6px 20px; border-radius: 28px; color: #fff; background: var(--nav);
             backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: 0 4px 20px #19193914; }
    .brand { font: 500 22px/1 "EB Garamond", Georgia, serif; margin-right: auto; }
    .live { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 28px; background: #ffffff33; font-size: 13px; }
    .live .dot { --c: var(--serving); box-shadow: 0 0 0 3px #10b98140; }
    .btn { display: inline-flex; padding: 8px 18px; border-radius: 28px; font-size: 13px; font-weight: 500;
           background: #fff; color: #18181b; text-decoration: none; }
    .btn:hover { color: #18181b; background: #f4f3fb; }

    /* Title row */
    .title { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin: 26px 2px 14px; }
    h1 { font-size: 24px; font-weight: 500; letter-spacing: -.02em; margin: 0; }
    .status { font-size: 15px; font-weight: 500; background: linear-gradient(90deg, var(--grad-b), var(--accent));
              -webkit-background-clip: text; background-clip: text; color: transparent; }

    /* KPI tiles */
    .kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
    .kpi { border-radius: 14px; padding: 14px 16px; }
    .kpi .label { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--muted); }
    .kpi .value { font-size: 26px; font-weight: 500; letter-spacing: -.02em; line-height: 1.25; margin-top: 4px; }
    .kpi .sub { font-size: 12px; color: var(--faint); }


    /* Two-column body: portals table + activity feed */
    .grid { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 12px; margin-top: 12px; align-items: start; }
    .panel { border-radius: 16px; overflow: hidden; }
    .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 18px;
                  border-bottom: 1px solid var(--border); }
    .panel-head h2 { font-size: 15px; font-weight: 600; margin: 0; }

    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; font-size: 12px; font-weight: 500; color: var(--faint); padding: 9px 14px; background: var(--row);
         border-bottom: 1px solid var(--border); white-space: nowrap; }
    td { padding: 11px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: var(--row); }
    .num { text-align: right; }
    .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 28px; font-size: 12px;
            font-weight: 500; color: var(--c); background: color-mix(in srgb, var(--c) 12%, transparent); white-space: nowrap; }
    .host { font-weight: 600; }
    .path { color: var(--faint); font-size: 12.5px; overflow-wrap: anywhere; }
    .reason { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
    .rowlinks { font-size: 12px; color: var(--faint); }
    .rowlinks a { margin-right: 8px; }

    /* Heartbeat: one mark per run, oldest left */
    .beats { display: flex; align-items: flex-end; gap: 2px; height: 18px; }
    .beat { width: 6px; height: 11px; border-radius: 2px; background: var(--serving); }
    .beat.failed { background: var(--failed); }
    .beat.repair { height: 18px; background: var(--healing); }
    .beat.repair.failed { background: transparent; box-shadow: inset 0 0 0 1.5px var(--failed); }
    .beat.running { background: var(--integrating); animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .3; } }
    @media (prefers-reduced-motion: reduce) { .beat.running { animation: none; } }
    .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--faint); padding: 10px 18px; border-top: 1px solid var(--border); }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend .beat { height: 10px; }

    /* Activity feed */
    .feed { list-style: none; margin: 0; padding: 0; max-height: 640px; overflow-y: auto; }
    .feed li { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 4px 10px; padding: 11px 18px;
               border-bottom: 1px solid var(--border); }
    .feed li:last-child { border-bottom: 0; }
    .feed .dot { margin-top: 6px; }
    .feed .what { font-weight: 500; }
    .feed .where { grid-column: 2 / -1; font-size: 12px; color: var(--faint); overflow-wrap: anywhere; }
    .feed .when { font-size: 12px; color: var(--faint); white-space: nowrap; }
    .feed details { grid-column: 2 / -1; font-size: 13px; color: var(--muted); }
    details summary { cursor: pointer; }
    details summary::marker { color: var(--faint); }
    pre { margin: 8px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--code); white-space: pre-wrap;
          font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); }
    .empty { padding: 28px 18px; color: var(--muted); }
    code { font-size: 12.5px; padding: 2px 6px; border-radius: 6px; background: var(--code); }

    @media (max-width: 1100px) {
      .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 700px) {
      main { padding: 8px 12px 32px; }
      header { padding-left: 16px; } .live { display: none; }
      .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .hide-sm { display: none; }
      td, th { padding: 10px; }
      td.nowrap { white-space: normal; }
    }

    /* Header: add-portal form */
    .brand { text-decoration: none; }
    .brand:hover { color: #fff; }
    .add { display: flex; gap: 6px; flex: 1 1 340px; max-width: 520px; }
    .add input { flex: 1; min-width: 0; padding: 8px 16px; border-radius: 28px; border: 0; font: inherit; font-size: 13px;
                 background: #ffffffe6; color: #18181b; }
    .add input:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    button.btn { border: 0; cursor: pointer; font-family: inherit; }
    .btn.ghost { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 1px var(--border); }
    .btn.ghost:hover { color: var(--text); background: var(--row); }
    .btn.danger { color: var(--failed); }
    .btn[disabled] { opacity: .6; cursor: progress; }
    .flash { margin-top: 12px; padding: 10px 16px; border-radius: 14px; background: var(--solid); box-shadow: var(--shadow); }
    .flash.err { color: var(--failed); }
    footer { margin-top: 18px; font-size: 12px; color: var(--faint); text-align: center; }
    .host a { text-decoration: none; } .host a:hover { text-decoration: underline; }

    /* Dashboard: state tiles filter, portal boxes, folding activity */
    button.kpi { font: inherit; color: inherit; text-align: left; cursor: pointer; transition: transform .15s, box-shadow .15s; }
    button.kpi:hover { transform: translateY(-1px); }
    button.kpi:active { transform: scale(.98); }
    button.kpi[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--c), var(--shadow); }
    button.kpi:focus-visible, .seg button:focus-visible, .icon:focus-visible, .fold > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .panel-head .tools-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .seg { display: inline-flex; padding: 3px; border-radius: 28px; background: var(--row); box-shadow: inset 0 0 0 1px var(--border); }
    .seg button { white-space: nowrap; border: 0; background: none; font: inherit; font-size: 12.5px; color: var(--muted); padding: 4px 12px; border-radius: 28px; cursor: pointer; }
    .seg button:hover { color: var(--text); }
    .seg button[aria-pressed="true"] { background: var(--solid); color: var(--text); box-shadow: 0 1px 3px #19193914; }
    .linkish { border: 0; background: none; padding: 0; font: inherit; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
    .bare { background: none; border: 0; box-shadow: none; overflow: visible; }
    .bare > .panel-head { border-bottom: 0; padding: 8px 4px 12px; flex-wrap: wrap; }
    .bare > .legend { border-top: 0; padding: 12px 4px 0; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px; }
    .card { position: relative; display: flex; flex-direction: column; gap: 6px; min-width: 0; padding: 12px 14px 12px;
            border-radius: 14px;
            transition: transform .16s ease, box-shadow .16s ease, opacity .25s ease; }
    .card:hover { transform: translateY(-2px); box-shadow: 0 10px 28px #1919392a; }
    .card:has(.card-link:active) { transform: scale(.975); box-shadow: 0 2px 8px #19193914; transition-duration: .06s; }
    .card:has(.card-link:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
    .card.leaving { opacity: 0; transform: scale(.94); }
    .card[hidden] { display: none; }
    .card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .card-link { font-weight: 600; font-size: 15px; text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; outline: none; }
    .card-link::after { content: ""; position: absolute; inset: 0; border-radius: inherit; }
    .card:hover .card-link { color: var(--grad-b); }
    .card .path { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: -4px; }
    .card .reason { margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-foot { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; margin-top: auto; font-size: 12.5px; color: var(--muted); }
    .card-foot b { font-size: 20px; font-weight: 500; letter-spacing: -.02em; color: var(--text); }
    .card-foot + .card-foot { margin-top: 0; }
    .tools { position: relative; z-index: 1; display: flex; gap: 4px; opacity: .55; transition: opacity .15s; }
    .card:hover .tools, .card:focus-within .tools { opacity: 1; }
    .icon { display: grid; place-items: center; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 50%;
            background: transparent; color: var(--muted); cursor: pointer; transition: background .15s, color .15s, transform .1s; }
    .icon:hover { background: var(--solid); color: var(--text); box-shadow: 0 1px 4px #1919391f; }
    .icon:active { transform: scale(.88); }
    .icon.danger:hover { color: var(--failed); }
    .icon svg { width: 15px; height: 15px; }
    .icon.spin svg { animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .cards .msg { grid-column: 1 / -1; border-radius: 14px; }
    .fold { position: sticky; top: 76px; }
    .fold > summary { list-style: none; cursor: pointer; user-select: none; }
    .fold > summary::-webkit-details-marker { display: none; }
    .chev { width: 14px; height: 14px; color: var(--faint); transition: transform .2s; }
    .fold[open] .chev { transform: rotate(90deg); }
    .fold:not([open]) > summary { border-bottom: 0; }
    .fold .feed { max-height: calc(100vh - 150px); }
    .grid:has(> .fold:not([open])) { grid-template-columns: minmax(0, 1fr) auto; }
    @media (prefers-reduced-motion: reduce) {
      .card, .card:hover, .card:has(.card-link:active), button.kpi, button.kpi:hover, .icon:active { transform: none; transition: none; }
      .icon.spin svg { animation: none; }
    }
    @media (max-width: 1100px) { .fold { position: static; } .grid:has(> .fold:not([open])) { grid-template-columns: 1fr; } }

    /* Portal page */
    .crumb { display: inline-block; margin: 22px 2px 0; font-size: 13px; color: var(--muted); text-decoration: none; }
    .facts { display: flex; gap: 8px 22px; flex-wrap: wrap; margin: 4px 2px 0; color: var(--muted); font-size: 13px; }
    .facts b { color: var(--text); font-weight: 600; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 2px 0; }
    .stack { display: grid; gap: 12px; margin-top: 12px; }
    .scroll { overflow-x: auto; }
    .t-title { font-weight: 500; }
    .t-meta { font-size: 12px; color: var(--faint); overflow-wrap: anywhere; }
    .docs { list-style: none; margin: 6px 0 0; padding: 0; font-size: 12.5px; }
    .docs li { display: flex; justify-content: space-between; gap: 10px; padding: 2px 0; }
    .nowrap { white-space: nowrap; }
  </style>
</head>
<body>
<main>
  <header>
    <a class="brand" href="/">Watchtower</a>
    <span class="live"><i class="dot"></i>Live, updated {{ now }} UTC</span>
    <form class="add" id="add-portal">
      <input name="url" type="url" required placeholder="Portal address, e.g. https://…/tenders" aria-label="Portal address">
      <button class="btn" type="submit">Add portal</button>
    </form>
  </header>
  <div id="flash" role="status"></div>
{% block content %}{% endblock %}
  <footer>Watchtower API: <code>/portals</code> · <a href="/docs">interactive API reference</a></footer>
</main>
<script>
  // Refresh every 10 s, but not while someone reads an opened run or types an address.
  setInterval(() => {
    const typing = document.activeElement && document.activeElement.tagName === "INPUT";
    if (!document.querySelector("details[open]:not(.fold)") && !typing && !document.hidden) location.reload();
  }, 10000);

  function flash(text, error) {
    const el = document.getElementById("flash");
    el.className = "flash" + (error ? " err" : "");
    el.textContent = text;
  }

  // Buttons and the form call the same API the judges use.
  async function call(method, path, body) {
    const res = await fetch(path, {
      method, headers: body ? {"content-type": "application/json"} : {}, body: body ? JSON.stringify(body) : undefined,
    });
    const data = res.status === 204 ? null : await res.json().catch(() => null);
    if (!res.ok) throw new Error((data && data.detail) || `HTTP ${res.status}`);
    return data;
  }

  document.getElementById("add-portal").addEventListener("submit", async (e) => {
    e.preventDefault();
    const button = e.target.querySelector("button");
    button.disabled = true;
    try {
      const { id } = await call("POST", "/portals", { url: e.target.url.value.trim() });
      location.href = `/ui/portals/${id}`;
    } catch (err) {
      flash(`Could not add the portal: ${err.message}`, true);
      button.disabled = false;
    }
  });
{% block script %}{% endblock %}
</script>
</body>
</html>
