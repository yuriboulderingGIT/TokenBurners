<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Watchtower{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* "Civic": a public register. Public Sans (made for government services), navy ink on paper,
       hairlines instead of shadows. Colour means state; a portal still learning is neutral, not good or bad. */
    :root {
      --page: #f3f5f8; --surface: #ffffff; --wash: #f6f8fb;
      --ink: #13233a; --ink-2: #44546a; --muted: #6b7a8f;
      --line: #e2e7ee; --line-2: #cfd7e2;
      --band: #13233a; --band-2: #1d3150; --accent: #1f5fbf; --accent-hover: #194f9f;
      --serving: #1a8a52; --integrating: #8293a8; --healing: #c97f06; --failed: #c8372d; --off: #b4bfcc;
    }
    * { box-sizing: border-box; }
    html { background: var(--page); }
    body { margin: 0; min-height: 100vh; color: var(--ink); background: var(--page);
           font: 14px/1.5 "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    a:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
    :focus-visible { outline: 3px solid #f2b705; outline-offset: 2px; border-radius: 2px; }
    .muted { color: var(--ink-2); } .faint { color: var(--muted); }
    .nowrap { white-space: nowrap; }

    .serving { --c: var(--serving); } .integrating { --c: var(--integrating); }
    .healing { --c: var(--healing); } .failed { --c: var(--failed); } .off { --c: var(--off); }
    .dot { display: inline-block; flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--off)); }

    /* Header band */
    .band { background: var(--band); color: #fff; }
    .band-in { max-width: 1320px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
    .brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; letter-spacing: -.01em; margin-right: auto; }
    .brand:hover { color: #fff; text-decoration: none; }
    .brand svg { flex: none; }
    .add { display: flex; gap: 8px; flex: 1 1 360px; max-width: 540px; }
    .add input { flex: 1; min-width: 0; padding: 8px 12px; border-radius: 4px; border: 1px solid transparent;
                 font: inherit; font-size: 14px; color: var(--ink); background: #fff; }
    .add input::placeholder { color: var(--muted); }
    .live { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: #b9c6d8; white-space: nowrap; }
    .live .dot { --c: #3fbf7f; }

    .btn { display: inline-flex; align-items: center; padding: 8px 16px; border-radius: 4px; border: 0; cursor: pointer;
           font: 600 14px/1.2 inherit; font-family: inherit; color: #fff; background: var(--accent); }
    .btn:hover { color: #fff; background: var(--accent-hover); text-decoration: none; }
    .band .btn { background: #2f6fd6; } .band .btn:hover { background: #3a7be6; }
    .btn.ghost { color: var(--ink); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-2); }
    .btn.ghost:hover { background: var(--wash); }
    .btn.danger { color: var(--failed); }
    .btn[disabled] { opacity: .6; cursor: progress; }

    main { max-width: 1320px; margin: 0 auto; padding: 0 24px 48px; }
    .flash { margin-top: 16px; padding: 10px 14px; border-radius: 4px; background: var(--surface); border: 1px solid var(--line-2); border-left: 4px solid var(--accent); }
    .flash.err { color: var(--failed); border-left-color: var(--failed); }
    h1 { font-size: 26px; font-weight: 700; letter-spacing: -.02em; line-height: 1.2; margin: 0; }

    /* Fleet: the headline, the totals, and one bar that shows the whole fleet at a glance */
    .fleet { margin: 32px 0 0; }
    .fleet-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px 40px; flex-wrap: wrap; }
    .fleet h1 { font-size: 32px; }
    .totals { display: flex; gap: 32px; margin: 0; flex-wrap: wrap; }
    .totals div { display: flex; flex-direction: column; }
    .totals dt { font-size: 12.5px; color: var(--muted); }
    .totals dd { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
    .fleet-bar { display: flex; gap: 3px; height: 12px; margin-top: 20px; }
    .fleet-bar span { min-width: 12px; background: var(--c); border-radius: 2px; }
    .fleet-bar span:first-child { border-radius: 6px 2px 2px 6px; }
    .fleet-bar span:last-child { border-radius: 2px 6px 6px 2px; }
    .fleet-bar span:only-child { border-radius: 6px; }
    .fleet-key { list-style: none; display: flex; gap: 8px 28px; flex-wrap: wrap; margin: 12px 0 0; padding: 0; }
    .fleet-key li { display: inline-flex; align-items: baseline; gap: 6px; font-size: 14px; }
    .fleet-key .dot { align-self: center; }
    .fleet-key b { font-weight: 700; }
    .fleet-key span { color: var(--muted); font-size: 13px; }
    .fleet-key .zero { color: var(--muted); } .fleet-key .zero .dot { background: var(--line-2); }

    /* Panels */
    .grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; margin-top: 24px; align-items: start; }
    .stack { display: grid; gap: 20px; margin-top: 20px; }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
    .panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 14px 18px 12px; border-bottom: 1px solid var(--line-2); }
    .panel-head h2 { font-size: 16px; font-weight: 700; margin: 0; }
    .panel-head .faint { font-size: 13px; }
    .scroll { overflow-x: auto; }

    table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    th { text-align: left; font-size: 12.5px; font-weight: 600; color: var(--ink-2); padding: 9px 12px; white-space: nowrap; border-bottom: 1px solid var(--line-2); }
    td { padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: var(--wash); }
    th:first-child, td:first-child { padding-left: 18px; } th:last-child, td:last-child { padding-right: 18px; }
    /* A problem row is marked at its edge, so it is found by scanning down the left */
    tr.failed td:first-child, tr.healing td:first-child { box-shadow: inset 4px 0 0 var(--c); }
    .num { text-align: right; }

    .pill { display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 600; color: var(--ink); white-space: nowrap; }
    .off .pill { color: var(--ink-2); font-weight: 500; }
    .host { font-weight: 600; }
    .path { max-width: 240px; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .reason { max-width: 250px; font-size: 13px; color: var(--ink-2); margin-top: 1px; }
    td .sub { font-size: 13px; color: var(--muted); }

    /* Heartbeat: a healthy read is grey paper; only problems and repairs carry colour */
    .beats { display: flex; align-items: flex-end; gap: 2px; height: 18px; }
    .beat { display: inline-block; width: 4px; height: 12px; border-radius: 1px; background: #c9d3df; }
    .beat.failed { background: var(--failed); }
    .beat.repair { height: 18px; background: var(--healing); }
    .beat.repair.failed { background: transparent; box-shadow: inset 0 0 0 1.5px var(--failed); }
    .beat.running { background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .3; } }
    @media (prefers-reduced-motion: reduce) { .beat.running { animation: none; } }
    .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); padding: 10px 18px; border-top: 1px solid var(--line); }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend .beat { height: 10px; } .legend .beat.repair { height: 14px; }

    /* Activity */
    .feed { list-style: none; margin: 0; padding: 0; max-height: 720px; overflow-y: auto; }
    .feed li { display: grid; grid-template-columns: 9px minmax(0, 1fr) auto; gap: 2px 10px; align-items: baseline;
               padding: 10px 18px; border-bottom: 1px solid var(--line); }
    .feed li:last-child { border-bottom: 0; }
    .feed .dot { align-self: center; }
    .feed .what { font-weight: 600; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .feed .where { margin-left: 4px; font-weight: 400; color: var(--ink-2); }
    .feed .when { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
    .feed details { grid-column: 2 / -1; font-size: 13px; color: var(--ink-2); }
    .feed li.routine { padding-top: 6px; padding-bottom: 6px; font-size: 13px; }
    .feed li.routine .dot { background: #c9d3df; width: 7px; height: 7px; }
    .feed li.routine .what { font-weight: 400; color: var(--muted); }
    .feed li.routine .where { color: var(--muted); }
    details summary { cursor: pointer; }
    details summary::marker { color: var(--muted); }
    pre { margin: 8px 0 0; padding: 10px 12px; border-radius: 4px; background: var(--wash); border: 1px solid var(--line); white-space: pre-wrap;
          font: 12px/1.55 ui-monospace, "Cascadia Mono", Consolas, monospace; color: var(--ink-2); }
    .empty { padding: 28px 18px; color: var(--ink-2); }
    code { font-size: 12.5px; padding: 2px 6px; border-radius: 3px; background: #e9edf3; }
    footer { margin-top: 28px; font-size: 12.5px; color: var(--muted); text-align: center; }
    footer a { text-decoration: underline; text-underline-offset: 3px; }

    /* Portal page */
    .crumb { display: inline-block; margin-top: 24px; font-size: 14px; color: var(--accent); }
    .page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap; margin: 10px 0 4px; }
    .page-title { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .portal-url { margin: 0; font-size: 13.5px; color: var(--muted); overflow-wrap: anywhere; }
    .portal-url a { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line-2); }
    .portal-reason { margin: 6px 0 20px; color: var(--ink-2); }
    .summary { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); margin: 0; background: var(--surface);
               border: 1px solid var(--line); border-radius: 6px; }
    .summary .cell { padding: 14px 18px; border-left: 1px solid var(--line); }
    .summary .cell:first-child { border-left: 0; }
    .summary dt { font-size: 12.5px; color: var(--muted); }
    .summary dd { margin: 0; display: flex; flex-direction: column; gap: 2px; }
    .summary b { font-size: 24px; font-weight: 600; letter-spacing: -.01em; line-height: 1.25; }
    .summary .s { font-size: 12.5px; color: var(--muted); line-height: 1.4; }
    .summary .none { font-size: 18px; color: var(--muted); }
    .t-title { font-weight: 600; }
    .t-meta { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
    .docs { list-style: none; margin: 6px 0 0; padding: 0; font-size: 13px; }
    .docs li { display: flex; justify-content: space-between; gap: 10px; padding: 2px 0; }
    .docs a { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }

    @media (max-width: 1240px) { .grid { grid-template-columns: 1fr; } }
    @media (max-width: 1000px) {
      .summary { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .summary .cell:nth-child(3n + 1) { border-left: 0; }
      .summary .cell:nth-child(n + 4) { border-top: 1px solid var(--line); }
    }
    @media (max-width: 700px) {
      .band-in { padding: 10px 16px; gap: 10px; } .live { display: none; }
      main { padding: 0 16px 32px; }
      .fleet { margin-top: 22px; } .fleet h1 { font-size: 26px; } .totals { gap: 20px; } .totals dd { font-size: 18px; }
      .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .summary .cell { border-left: 1px solid var(--line); border-top: 0; }
      .summary .cell:nth-child(odd) { border-left: 0; }
      .summary .cell:nth-child(n + 3) { border-top: 1px solid var(--line); }
      .hide-sm { display: none; }
      td, th { padding: 10px; } th:first-child, td:first-child { padding-left: 14px; }
      .path, .reason { max-width: 52vw; }
    }
  </style>
</head>
<body>
<header class="band">
  <div class="band-in">
    <a class="brand" href="/"><svg width="18" height="20" viewBox="0 0 18 20" aria-hidden="true"><path d="M9 1 2 4.5v5c0 4.6 3 8 7 9.5 4-1.5 7-4.9 7-9.5v-5L9 1Z" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/><path d="m5.8 10 2.3 2.3 4.2-4.6" fill="none" stroke="#3fbf7f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Watchtower</a>
    <form class="add" id="add-portal">
      <input name="url" type="url" required placeholder="Portal address, e.g. https://…/tenders" aria-label="Portal address">
      <button class="btn" type="submit">Add portal</button>
    </form>
    <span class="live"><i class="dot"></i>Live, updated {{ now }} UTC</span>
  </div>
</header>
<main>
  <div id="flash" role="status"></div>
{% block content %}{% endblock %}
  <footer>Watchtower API: <code>/portals</code> · <a href="/docs">interactive API reference</a></footer>
</main>
<script>
  // Refresh every 10 s, but not while someone reads an opened run or types an address.
  setInterval(() => {
    const typing = document.activeElement && document.activeElement.tagName === "INPUT";
    if (!document.querySelector("details[open]") && !typing) location.reload();
  }, 10000);

  function flash(text, error) {
    const el = document.getElementById("flash");
    el.className = "flash" + (error ? " err" : "");
    el.textContent = text;
  }

  // Buttons and the form call the same API the judges use.
  async function call(method, path, body) {
    const res = await fetch(path, {
      method, headers: body ? {"content-type": "application/json"} : {}, body: body ? JSON.stringify(body) : undefined,
    });
    const data = res.status === 204 ? null : await res.json().catch(() => null);
    if (!res.ok) throw new Error((data && data.detail) || `HTTP ${res.status}`);
    return data;
  }

  document.getElementById("add-portal").addEventListener("submit", async (e) => {
    e.preventDefault();
    const button = e.target.querySelector("button");
    button.disabled = true;
    try {
      const { id } = await call("POST", "/portals", { url: e.target.url.value.trim() });
      location.href = `/ui/portals/${id}`;
    } catch (err) {
      flash(`Could not add the portal: ${err.message}`, true);
      button.disabled = false;
    }
  });
{% block script %}{% endblock %}
</script>
</body>
</html>
